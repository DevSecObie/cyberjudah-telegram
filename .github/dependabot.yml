version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    # Major upgrades are done deliberately, one at a time: the 2026-10-05
    # development-group batch (TypeScript 5→7, Vite 7→8, @vitejs/plugin-react
    # 5→6, @cloudflare/workers-types 4→5) failed the main checks and every
    # browser test, so Dependabot no longer proposes major versions of them.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@cloudflare/workers-types"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
