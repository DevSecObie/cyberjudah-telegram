name: live-probe
# A one-off look at what staging serves for the Bible Strong fork's feed. Read-only.
on:
  push:
    branches: [claude/live-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Staging feed and class media
        run: |
          S=https://cyberjudah-telegram-staging.oisrae1.workers.dev
          for p in /bs/health /bs/v1/bibles/KJV/coverage /bs/v1/bibles/KJV/books/1/chapters/1 /app/strong/_media/1/1 /api/health; do
            echo "=================== $p"
            curl -sS -o body.txt -w "status=%{http_code} type=%{content_type}\n" "$S$p" || true
            head -c 400 body.txt; echo
          done
          echo "=================== data origin from the runner"
          curl -sS -o /dev/null -w "status=%{http_code}\n" https://data.cyberjudah.io/api/kjv/genesis/1.json
