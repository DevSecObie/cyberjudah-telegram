name: deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_URL: ${{ vars.TELEGRAM_APP_URL }}

  deploy:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check the repository secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          # Fail here, by name, rather than three minutes later inside wrangler.
          missing=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN WEBHOOK_SECRET; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings → Secrets and variables → Actions → Repository secrets (not Variables, and not an Environment)."
            exit 1
          fi
          echo "All four secrets are set."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_APP_URL: ${{ vars.TELEGRAM_APP_URL }}
      - name: Deploy the worker
        id: deploy
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The D1 database and the KV namespace are found or created here, so nothing
          # account-specific is committed; wrangler.jsonc carries placeholders.
          D1=$(bash scripts/d1-id.sh cyberjudah-telegram)
          KV=$(bash scripts/kv-id.sh SUBS)
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1/; s/00000000000000000000000000000000/$KV/" wrangler.jsonc
          npx wrangler deploy 2>&1 | tee deploy.log
          # The Worker's public URL, from wrangler's own output, unless the repo names one.
          URL="${{ vars.WORKER_URL }}"
          [ -n "$URL" ] || URL=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker: $URL"
          # The search index follows the library: reload it from the data set on every deploy.
          node scripts/load-search.mjs
      - name: Register the webhook, commands and menu button
        working-directory: bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The Worker needs the same secrets Telegram will present; wrangler stores them on the Worker.
          printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET
          printf '%s' "$WORKER_URL" | npx wrangler secret put WORKER_URL
          node scripts/setup.mjs

  refresh-search:
    # The library changes when the cyberjudah repo publishes; keep the search index fresh.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/load-search.mjs
