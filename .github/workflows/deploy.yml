name: deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      embed:
        description: "Also embed the library and the transcripts into the Vectorize index (new and changed passages)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_URL: ${{ vars.TELEGRAM_APP_URL }}
          VITE_ACCOUNT_SYNC: "true"
          CYBERJUDAH_APP_BASE: /app/

  release-browser-checks:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/e2e.yml

  deploy:
    needs: [check, release-browser-checks]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Attach required reviewers under Settings → Environments → production to gate
    # production deploys behind a human approval. Until then this is a label only.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check the repository secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          # Fail here, by name, rather than three minutes later inside wrangler.
          missing=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN WEBHOOK_SECRET; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings → Secrets and variables → Actions → Repository secrets (not Variables, and not an Environment)."
            exit 1
          fi
          echo "All four secrets are set."
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_APP_URL: ${{ vars.TELEGRAM_APP_URL }}
          VITE_ACCOUNT_SYNC: "true"
          CYBERJUDAH_APP_BASE: /app/
      - name: Upload the app's pictures to R2
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Portraits and Timeline paintings are served from R2 (/api/img/); only new or changed files go up.
        run: node scripts/deploy-images.mjs
      - name: Require the account sync signing secret
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The app now syncs saved marks through Firebase. Without the Worker's signing secret every
          # reader's sign-in would fail and editing marks would pause, so stop before deploying.
          # Listing returns names only.
          npx wrangler secret list > "$RUNNER_TEMP/secret-names.json"
          node -e 'const names = require(process.argv[1]); if (!names.some(s => s.name === "FIREBASE_SERVICE_ACCOUNT")) { console.log("::error::Set FIREBASE_SERVICE_ACCOUNT on the production Worker (npx wrangler secret put FIREBASE_SERVICE_ACCOUNT) before deploying account sync."); process.exit(1); }' "$RUNNER_TEMP/secret-names.json"
      - name: Deploy the worker
        id: deploy
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The D1 database and the KV namespace are found or created here, so nothing
          # account-specific is committed; wrangler.jsonc carries placeholders.
          D1=$(bash scripts/d1-id.sh cyberjudah-telegram)
          TEACH=$(bash scripts/d1-id.sh cyberjudah)
          KV=$(bash scripts/kv-id.sh SUBS)
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1/; s/11111111-1111-1111-1111-111111111111/$TEACH/; s/00000000000000000000000000000000/$KV/" wrangler.jsonc
          # The Vectorize index of the teachings and the R2 bucket of spoken verses: created once,
          # kept after. The API token needs Vectorize Edit, Workers AI Read and R2 Edit for this;
          # a missing permission stops here, by name, rather than inside the deploy.
          if ! npx wrangler vectorize list 2>/dev/null | grep -q cyberjudah-teachings; then
            npx wrangler vectorize create cyberjudah-teachings --dimensions=1024 --metric=cosine \
              || { echo "::error::Could not create the Vectorize index. Give the CLOUDFLARE_API_TOKEN the 'Vectorize Edit' permission (Cloudflare dashboard → My Profile → API Tokens → edit the token → add Account · Vectorize · Edit, plus Workers AI · Read and Workers R2 Storage · Edit)."; exit 1; }
            npx wrangler vectorize create-metadata-index cyberjudah-teachings --property-name=kind --type=string || true
          fi
          if ! npx wrangler r2 bucket list 2>/dev/null | grep -q cyberjudah-audio; then
            npx wrangler r2 bucket create cyberjudah-audio \
              || { echo "::error::Could not create the R2 bucket. If the message says to enable R2: Cloudflare dashboard → R2 Object Storage → Get started (the free allowance is enough; it asks to confirm a plan). Otherwise give the CLOUDFLARE_API_TOKEN the 'Workers R2 Storage Edit' permission."; exit 1; }
          fi
          set -o pipefail
          # Stage the built app at both / and /app/ so the SPA loads on
          # workers.dev and on cyberjudah.io/app (see the script header).
          bash scripts/prepare-assets.sh
          npx wrangler deploy 2>&1 | tee deploy.log
          # The Worker's public URL, from wrangler's own output, unless the repo names one.
          URL="${{ vars.WORKER_URL }}"
          [ -n "$URL" ] || URL=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker: $URL"
          # The search index follows the library: reload it from the data set on every deploy.
          node scripts/load-search.mjs
      - name: Register the webhook, commands and menu button
        working-directory: bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CYBERJUDAH_TOKEN: ${{ secrets.CYBERJUDAH_TOKEN }}
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          PRIVACY_KEY: ${{ secrets.PRIVACY_KEY }}
          TELEGRAM_LOGIN_CLIENT_ID: ${{ secrets.TELEGRAM_LOGIN_CLIENT_ID }}
          TELEGRAM_LOGIN_CLIENT_SECRET: ${{ secrets.TELEGRAM_LOGIN_CLIENT_SECRET }}
        run: |
          # The Worker needs the same secrets Telegram will present; wrangler stores them on the Worker.
          printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET
          printf '%s' "$WORKER_URL" | npx wrangler secret put WORKER_URL
          # Ask CyberJudah answers with Claude when the repository has an ANTHROPIC_API_KEY secret.
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; else echo "No ANTHROPIC_API_KEY secret: Ask CyberJudah answers with Llama on Workers AI."; fi
          # Notes can be edited from the app when the repository has a CYBERJUDAH_TOKEN secret (a
          # fine-grained GitHub token with contents write on DevSecObie/cyberjudah) and ADMIN_IDS
          # names the Telegram user ids allowed to edit.
          if [ -n "$CYBERJUDAH_TOKEN" ]; then printf '%s' "$CYBERJUDAH_TOKEN" | npx wrangler secret put CYBERJUDAH_TOKEN; else echo "No CYBERJUDAH_TOKEN secret: notes are read-only in the app."; fi
          # A token configured directly on the Worker remains intact when no repository copy exists.
          if [ -n "$APP_REPO_TOKEN" ]; then printf '%s' "$APP_REPO_TOKEN" | npx wrangler secret put APP_REPO_TOKEN; fi
          if [ -n "$ADMIN_IDS" ]; then printf '%s' "$ADMIN_IDS" | npx wrangler secret put ADMIN_IDS; fi
          # Web Push for reading reminders: all three VAPID secrets or none (docs/OPERATIONS.md).
          # A partial set would make push look available while every send fails, so it stops here.
          n=0; for k in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do [ -n "${!k}" ] && n=$((n+1)); done
          if [ "$n" = 3 ]; then
            for k in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do printf '%s' "${!k}" | npx wrangler secret put "$k"; done
          elif [ "$n" = 0 ]; then echo "No VAPID secrets: push reminders show as not set up; Telegram reminders work."
          else echo "::error::Set all three of VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT, or none."; exit 1; fi
          # Claude's calls go through Cloudflare AI Gateway when the repository has a CF_AIG_TOKEN
          # secret (an AI Gateway token with Run permission); otherwise Claude is called directly.
          if [ -n "$CF_AIG_TOKEN" ]; then printf '%s' "$CF_AIG_TOKEN" | npx wrangler secret put CF_AIG_TOKEN; else echo "No CF_AIG_TOKEN secret: Claude is called directly; Workers AI still goes through AI Gateway."; fi
          # Every record about a person is filed and encrypted under PRIVACY_KEY (bot/src/privacy.mjs,
          # docs/PRIVACY.md). It must exist before production stores anything, and never change:
          # records made under one key cannot be found or opened under another.
          if [ -z "$PRIVACY_KEY" ]; then echo "::error::Add the PRIVACY_KEY repository secret (docs/PRIVACY.md) before deploying: records about people are filed and encrypted under it."; exit 1; fi
          printf '%s' "$PRIVACY_KEY" | npx wrangler secret put PRIVACY_KEY
          # OIDC is opt-in. Keep any directly configured Worker values intact when absent.
          if [ -n "$TELEGRAM_LOGIN_CLIENT_ID" ] && [ -n "$TELEGRAM_LOGIN_CLIENT_SECRET" ]; then
            printf '%s' "$TELEGRAM_LOGIN_CLIENT_ID" | npx wrangler secret put TELEGRAM_LOGIN_CLIENT_ID
            printf '%s' "$TELEGRAM_LOGIN_CLIENT_SECRET" | npx wrangler secret put TELEGRAM_LOGIN_CLIENT_SECRET
          elif [ -n "$TELEGRAM_LOGIN_CLIENT_ID$TELEGRAM_LOGIN_CLIENT_SECRET" ]; then
            echo "::error::Set both TELEGRAM_LOGIN_CLIENT_ID and TELEGRAM_LOGIN_CLIENT_SECRET."; exit 1
          else echo "No Telegram Login credentials: browser sign-in stays disabled unless configured directly on the Worker."; fi
          node scripts/setup.mjs
      - name: Verify the deployed app and authenticated search
        working-directory: bot
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          EXPECTED_SEARCH_MODEL: "@cf/meta/llama-3.1-8b-instruct-fp8"
          VERIFY_ACCOUNT_SYNC: "true"
        run: node scripts/verify-release.mjs

  refresh-search:
    # The library changes when the cyberjudah repo publishes; keep the search index fresh.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler needs the real database id; the deploy job writes it the same way.
          D1=$(bash scripts/d1-id.sh cyberjudah-telegram)
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1/" wrangler.jsonc
          node scripts/load-search.mjs

  embed:
    # The Vectorize index follows the library and the transcripts: new and changed passages,
    # nightly after the transcripts load, or on demand (the first run embeds everything).
    # After the deploy, so the index it fills exists.
    needs: deploy
    if: always() && needs.deploy.result != 'failure' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.embed))
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/embed.mjs
