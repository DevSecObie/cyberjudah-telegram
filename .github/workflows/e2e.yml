name: end-to-end

on:
  pull_request:
  # The merge queue tests each queued PR on top of main before it lands (Settings → Branches).
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. On main, and inside a deploy, runs queue
# instead: cancelling them made an overlapping deploy fail before it reached the Approve step
# (deploy #2437/#2438, 4 Nov). Bible Strong's production workflows do the same (cancel-in-progress: false).
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  account-deletion:
    name: account-deletion (${{ matrix.contract }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - contract: telegram-production
            rules: app/firebase/firestore.rules
            scope: production
          - contract: native-production-and-staging
            rules: native-deletion-contract/apps/expo/firebase/cyberjudah/firestore.rules
            scope: both
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Test the actual saved native candidate, not whichever rules an unrelated branch has today.
      # This checkout is test input only; no rule deployment or readiness gate is changed.
      - name: Check out the native candidate's rules
        if: matrix.contract == 'native-production-and-staging'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DevSecObie/cyberjudah-app
          ref: 198c31124fd6e4c424979839aa0b72f49dfbe90f
          path: native-deletion-contract
          persist-credentials: false
          sparse-checkout: apps/expo/firebase/cyberjudah/firestore.rules
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Configure the isolated deletion emulator
        env:
          DELETION_RULES: ${{ matrix.rules }}
        run: |
          node --input-type=module <<'JS'
          import { accessSync, writeFileSync } from 'node:fs';
          accessSync(process.env.DELETION_RULES);
          writeFileSync('.firestore-deletion-test.json', JSON.stringify({
            firestore: { rules: process.env.DELETION_RULES },
            emulators: { firestore: { host: '127.0.0.1', port: 8089 }, ui: { enabled: false }, singleProjectMode: true },
          }));
          JS
      - name: Verify deletion, isolation, interruption and retry against Firestore
        env:
          REQUIRE_FIRESTORE_EMULATOR: '1'
          FIRESTORE_RULES_TEST_SCOPE: ${{ matrix.scope }}
        run: >-
          npx --yes --package firebase-tools@15.33.0 firebase emulators:exec
          --config .firestore-deletion-test.json --only firestore --project demo-cyberjudah
          'node --test bot/tests/firestore-admin-emulator.test.mjs'

  browser-tests:
    runs-on: ubuntu-latest
    # Microsoft's Playwright image already carries every browser's system packages (and the browsers
    # for this version), so nothing is fetched from Ubuntu's mirror, which some days crawls (minutes
    # per package). Keep the tag on the @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Each engine's suite is split across jobs (Playwright shards), each with its own server, so the
    # one-worker runs stay isolated while the slowest engine finishes in about a quarter of the time.
    name: browser-tests (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.total }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Pull requests run Chromium only; WebKit and Firefox run on main, in the merge queue and for
      # releases (workflow_call), so a pull request is not held for three engines.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"browser":"chromium","shard":1,"total":4},{"browser":"chromium","shard":2,"total":4},{"browser":"chromium","shard":3,"total":4},{"browser":"chromium","shard":4,"total":4}]' || '[{"browser":"chromium","shard":1,"total":4},{"browser":"chromium","shard":2,"total":4},{"browser":"chromium","shard":3,"total":4},{"browser":"chromium","shard":4,"total":4},{"browser":"webkit","shard":1,"total":2},{"browser":"webkit","shard":2,"total":2},{"browser":"firefox","shard":1,"total":2},{"browser":"firefox","shard":2,"total":2}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # A no-op while the image's tag matches the locked version; after an upgrade it downloads the
      # browser alone (its system packages are in the image).
      - name: Install the browser
        timeout-minutes: 20
        run: npx playwright install ${{ matrix.browser }}
      - run: npm run test:e2e --workspace app -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          CI: "true"
          # The container runs as root, and Firefox will not start as root under a HOME it does not
          # own; Actions sets each step's HOME to /github/home, so it is set back here.
          HOME: /root
      # The Firebase checks run once per engine, in its first shard.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        if: matrix.shard == 1
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the published rules and retry-safe imports
        if: matrix.browser == 'chromium' && matrix.shard == 1
        run: npx --yes --package firebase-tools@15.33.0 firebase emulators:exec --config app/firebase/firebase.json --only firestore --project demo-cyberjudah 'node --test app/firebase/tests/*.test.mjs'
      - name: Check account sync in this browser
        if: matrix.shard == 1
        run: npx --yes --package firebase-tools@15.33.0 firebase emulators:exec --config app/firebase/firebase.json --only auth,firestore --project demo-cyberjudah 'npm run test:e2e --workspace app -- account-sync.spec.ts --project=${{ matrix.browser }}'
        env:
          CI: 'true'
          HOME: /root
          VITE_ACCOUNT_SYNC: 'true'
          VITE_FIREBASE_EMULATOR: 'true'
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the required status name while each engine runs its own isolated Worker.
  playwright:
    if: always()
    needs: [browser-tests, account-deletion]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          test "${{ needs.browser-tests.result }}" = success
          test "${{ needs.account-deletion.result }}" = success
