name: end-to-end

on:
  pull_request:
  # The merge queue tests each queued PR on top of main before it lands (Settings → Branches).
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    # Microsoft's Playwright image already carries every browser's system packages (and the browsers
    # for this version), so nothing is fetched from Ubuntu's mirror, which some days crawls (minutes
    # per package). Keep the tag on the @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Each engine's suite is split across jobs (Playwright shards), each with its own server, so the
    # one-worker runs stay isolated while the slowest engine finishes in about a quarter of the time.
    name: browser-tests (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.total }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1, total: 4 }
          - { browser: chromium, shard: 2, total: 4 }
          - { browser: chromium, shard: 3, total: 4 }
          - { browser: chromium, shard: 4, total: 4 }
          - { browser: webkit, shard: 1, total: 2 }
          - { browser: webkit, shard: 2, total: 2 }
          - { browser: firefox, shard: 1, total: 2 }
          - { browser: firefox, shard: 2, total: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # A no-op while the image's tag matches the locked version; after an upgrade it downloads the
      # browser alone (its system packages are in the image).
      - name: Install the browser
        timeout-minutes: 20
        run: npx playwright install ${{ matrix.browser }}
      - run: npm run test:e2e --workspace app -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          CI: "true"
          # The container runs as root, and Firefox will not start as root under a HOME it does not
          # own; Actions sets each step's HOME to /github/home, so it is set back here.
          HOME: /root
      # The Firebase checks run once per engine, in its first shard.
      - uses: actions/setup-java@v6
        if: matrix.shard == 1
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the published rules and retry-safe imports
        if: matrix.browser == 'chromium' && matrix.shard == 1
        run: npx --yes --package firebase-tools@15.33.0 firebase emulators:exec --config app/firebase/firebase.json --only firestore --project demo-cyberjudah 'node --test app/firebase/tests/*.test.mjs'
      - name: Check account sync in this browser
        if: matrix.shard == 1
        run: npx --yes --package firebase-tools@15.33.0 firebase emulators:exec --config app/firebase/firebase.json --only auth,firestore --project demo-cyberjudah 'npm run test:e2e --workspace app -- account-sync.spec.ts --project=${{ matrix.browser }}'
        env:
          CI: 'true'
          HOME: /root
          VITE_ACCOUNT_SYNC: 'true'
          VITE_FIREBASE_EMULATOR: 'true'
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the required status name while each engine runs its own isolated Worker.
  playwright:
    if: always()
    needs: browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.browser-tests.result }}" = success
