name: end-to-end

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    # The Bible's reader is built first (a few minutes), then the suite runs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # The Bible is Bible Strong's reader, served at /app/strong from strong/dist
      # (bot/scripts/prepare-assets.sh copies it): without it the Bible never loads.
      - name: Cache the Bible Strong fork's packages
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: strong-yarn-${{ hashFiles('strong/yarn.lock') }}
      - name: Build the Bible Strong fork (staged at /app/strong)
        run: bash strong/build-web.sh
      - run: npm run test:e2e --workspace app -- --project=${{ matrix.browser }}
        env:
          CI: "true"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the published rules and retry-safe imports
        if: matrix.browser == 'chromium'
        run: npx --yes --package firebase-tools@15.33.0 firebase emulators:exec --config app/firebase/firebase.json --only firestore --project demo-cyberjudah 'node --test app/firebase/tests/*.test.mjs'
      - name: Check account sync in this browser
        run: npx --yes --package firebase-tools@15.33.0 firebase emulators:exec --config app/firebase/firebase.json --only auth,firestore --project demo-cyberjudah 'npm run test:e2e --workspace app -- account-sync.spec.ts --project=${{ matrix.browser }}'
        env:
          CI: 'true'
          VITE_ACCOUNT_SYNC: 'true'
          VITE_FIREBASE_EMULATOR: 'true'
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ matrix.browser }}
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the required status name while each engine runs its own isolated Worker.
  playwright:
    if: always()
    needs: browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.browser-tests.result }}" = success
