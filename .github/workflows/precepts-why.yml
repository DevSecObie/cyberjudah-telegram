name: precepts-why

# Writes the "Precept(s)" breakdowns in the Bible app, a line or two on why each precept a
# class lined up with a scripture is there, with scripts/precepts/why.py in the cyberjudah
# repository (Message Batches). It runs here because the ANTHROPIC_API_KEY secret lives here,
# and pushes data/precepts/why.json back to cyberjudah with CYBERJUDAH_TOKEN. Without that
# token the file is kept as a workflow artifact instead. On demand only.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: At most this many passages (0 for every missing one)
        default: "0"

permissions:
  contents: read

concurrency:
  group: precepts-why
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          repository: DevSecObie/cyberjudah
          ref: main
          token: ${{ secrets.CYBERJUDAH_TOKEN || github.token }}
          path: cyberjudah
      - run: python3 -m pip install --upgrade anthropic

      - name: Write the breakdowns
        working-directory: cyberjudah
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          set -o pipefail
          python3 scripts/precepts/why.py --plan --limit "$LIMIT" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/precepts/why.py --limit "$LIMIT" --show --timeout 9000 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: precepts-why
          path: cyberjudah/data/precepts/why.json
          if-no-files-found: ignore

      - name: Push to cyberjudah
        working-directory: cyberjudah
        env:
          CYBERJUDAH_TOKEN: ${{ secrets.CYBERJUDAH_TOKEN }}
        run: |
          if [[ -z "$CYBERJUDAH_TOKEN" ]]; then echo "No CYBERJUDAH_TOKEN; the file is in the artifact."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precepts/why.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "precepts: breakdowns for $(python3 -c 'import json;print(len(json.load(open("data/precepts/why.json"))))') precepts"
          remote="https://x-access-token:${CYBERJUDAH_TOKEN}@github.com/DevSecObie/cyberjudah.git"
          for attempt in 1 2 3; do
            if git push "$remote" HEAD:main; then exit 0; fi
            git pull --rebase "$remote" main
            sleep $((attempt * 3))
          done
          exit 1
