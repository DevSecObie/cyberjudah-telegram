name: live-smoke

on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    name: production (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The journeys share one synthetic account. Serialize shards so chats, settings and
      # subscriptions cannot be changed by two shards at once; do not use max-parallel: 4.
      max-parallel: 1
      matrix:
        shard: [1, 2, 3, 4]
    environment: automation
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # The suite runs at the Worker's root (the app is served at both / and /app/ there), so it
      # needs the workers.dev address, not cyberjudah.io. Without an address Playwright starts a
      # local Worker with empty storage instead, and the "production" check tests nothing real.
      - name: Resolve the production worker address
        id: address
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          url = os.environ.get('WORKER_URL', '').strip().rstrip('/')
          if not url:
              account = os.environ['CLOUDFLARE_ACCOUNT_ID']
              req = urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain', headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              subdomain = result.get('result', {}).get('subdomain', '')
              if not result.get('success') or not re.fullmatch(r'[a-z0-9-]+', subdomain):
                  raise SystemExit('Could not resolve the production Worker address.')
              url = f'https://cyberjudah-telegram.{subdomain}.workers.dev'
          if not url.startswith('https://'):
              raise SystemExit(f'Refusing to run the live suite against {url!r}.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'url={url}\n')
          print('Production:', url)
          PY
      - name: Exercise production user journeys
        id: journeys
        # Playwright fails at 28 minutes; this fallback and the job leave time for reporting.
        timeout-minutes: 30
        run: npm run test:e2e --workspace app -- --project=chromium --shard=${{ matrix.shard }}/4 --global-timeout=1680000 --reporter=list,github,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/app/test-results/live-smoke.json
          RUN_LIVE_E2E: "1"
          PLAYWRIGHT_BASE_URL: ${{ steps.address.outputs.url }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Summarize production user journeys
        if: always()
        env:
          SMOKE_SHARD: ${{ matrix.shard }}/4
          SMOKE_OUTCOME: ${{ steps.journeys.outcome }}
        run: node app/scripts/summarize-live-smoke.mjs app/test-results/live-smoke.json
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: live-smoke-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore
          retention-days: 7
