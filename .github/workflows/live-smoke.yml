name: live-smoke

on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Exercise production user journeys
        run: npm run test:e2e --workspace app
        env:
          RUN_LIVE_E2E: "1"
          PLAYWRIGHT_BASE_URL: ${{ vars.WORKER_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ github.run_id }}
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore
          retention-days: 7
