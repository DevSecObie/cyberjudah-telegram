name: Practice crowd test (staging)

# By hand only. Sends the calls of many pretend visits to the STAGING Worker (never production) and
# writes how many failed and how long they took to the run's summary. No secrets are used.
on:
  workflow_dispatch:
    inputs:
      visits:
        description: Pretend visits (at most 5000)
        default: "1000"
        required: true
      parallel:
        description: Visits at the same time (at most 200)
        default: "50"
        required: true

permissions:
  contents: read

concurrency:
  group: crowd-test
  cancel-in-progress: false

jobs:
  crowd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Practice crowd
        env:
          VISITS: ${{ inputs.visits }}
          PARALLEL: ${{ inputs.parallel }}
        run: node bot/scripts/crowd-test.mjs "https://cyberjudah-telegram-staging.oisrae1.workers.dev" "$VISITS" "$PARALLEL"
