name: native-build
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'shared/**', 'package-lock.json', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run native:sync --workspace app
      - run: ./gradlew lintDebug assembleDebug
        working-directory: app/android
      - uses: actions/upload-artifact@v7
        with:
          name: cyberjudah-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run native:sync --workspace app
      - name: Compile for the iOS simulator without signing
        run: xcodebuild -project app/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/cyberjudah-ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        with:
          name: cyberjudah-ios-simulator
          path: /tmp/cyberjudah-ios/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 7
