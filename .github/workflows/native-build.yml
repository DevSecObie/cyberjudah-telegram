name: native-build
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'bot/**', 'shared/**', 'package-lock.json', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  reader-profile:
    runs-on: ubuntu-latest
    # Reuse the browser libraries already validated by e2e.yml instead of installing them
    # from the runner's package mirror before this bounded verification job can start.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium webkit
        working-directory: app
      # The shared browser fixture starts Firestore even for native-reader checks.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify native reading, linked Ask access and disabled purchases
        run: npm run test:e2e --workspace app -- native-reader.spec.ts offline-search.spec.ts --project=chromium --project=webkit
        env:
          CYBERJUDAH_TEST_NATIVE_READER: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: native-reader-traces
          path: app/test-results
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run native:sync --workspace app
      - run: ./gradlew lintDebug assembleDebug bundleRelease
        working-directory: app/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cyberjudah-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cyberjudah-android-unsigned-bundle
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run native:sync --workspace app
      - name: Compile for the iOS simulator without signing
        run: xcodebuild -project app/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/cyberjudah-ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cyberjudah-ios-simulator
          path: /tmp/cyberjudah-ios/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 7
      - name: Archive the device build without signing or submission
        run: xcodebuild -project app/ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release -archivePath /tmp/cyberjudah-device.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cyberjudah-ios-unsigned-archive
          path: /tmp/cyberjudah-device.xcarchive
          retention-days: 7
