name: native-build
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'bot/**', 'shared/**', 'package-lock.json', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  reader-profile:
    strategy:
      fail-fast: false
      matrix:
        environment: [production, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
        working-directory: app
      - name: Verify the free store profile and internal linked-Ask profile
        run: npm run test:e2e --workspace app -- native-reader.spec.ts offline-search.spec.ts --project=chromium --project=webkit
        env:
          CYBERJUDAH_TEST_NATIVE_READER: "1"
          CYBERJUDAH_TEST_NATIVE_ENV: ${{ matrix.environment }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-${{ matrix.environment }}-reader-traces
          path: app/test-results
          retention-days: 7
  android:
    strategy:
      fail-fast: false
      matrix:
        environment: [production, staging]
    env:
      CYBERJUDAH_NATIVE_ENV: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run native:sync --workspace app
      - name: Verify the bundled target
        run: node app/scripts/verify-native-build.mjs
      - run: ./gradlew lintDebug assembleDebug bundleRelease
        working-directory: app/android
      - name: Verify the APK application ID
        run: node app/scripts/verify-native-build.mjs --android
      - uses: actions/upload-artifact@v7
        with:
          name: cyberjudah-${{ matrix.environment == 'staging' && 'staging-' || '' }}android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: cyberjudah-${{ matrix.environment == 'staging' && 'staging-' || '' }}android-unsigned-bundle
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
  ios:
    strategy:
      fail-fast: false
      matrix:
        environment: [production, staging]
    env:
      CYBERJUDAH_NATIVE_ENV: ${{ matrix.environment }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run native:sync --workspace app
      - name: Verify the bundled target
        run: node app/scripts/verify-native-build.mjs
      - name: Compile for the iOS simulator without signing
        run: xcodebuild -project app/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/cyberjudah-ios CODE_SIGNING_ALLOWED=NO build
      - name: Verify and package the simulator app
        run: |
          APP=/tmp/cyberjudah-ios/Build/Products/Debug-iphonesimulator/App.app
          node app/scripts/verify-native-build.mjs --ios "$APP/Info.plist"
          ditto -c -k --keepParent "$APP" /tmp/cyberjudah-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: cyberjudah-${{ matrix.environment == 'staging' && 'staging-' || '' }}ios-simulator
          path: /tmp/cyberjudah-simulator.zip
          retention-days: 7
      - name: Archive the device build without signing or submission
        run: xcodebuild -project app/ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release -archivePath /tmp/cyberjudah-device.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Verify and package the unsigned device archive
        run: |
          node app/scripts/verify-native-build.mjs --ios /tmp/cyberjudah-device.xcarchive/Products/Applications/App.app/Info.plist
          ditto -c -k --keepParent /tmp/cyberjudah-device.xcarchive /tmp/cyberjudah-device-unsigned.zip
      - uses: actions/upload-artifact@v7
        with:
          name: cyberjudah-${{ matrix.environment == 'staging' && 'staging-' || '' }}ios-unsigned-archive
          path: /tmp/cyberjudah-device-unsigned.zip
          retention-days: 7
