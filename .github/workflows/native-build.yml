name: native-build
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'bot/**', 'shared/**', 'package-lock.json', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  reader-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
        working-directory: app
      - name: Verify native reading, linked Ask access and disabled purchases
        run: npm run test:e2e --workspace app -- native-reader.spec.ts offline-search.spec.ts --project=chromium --project=webkit
        env:
          CYBERJUDAH_TEST_NATIVE_READER: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-reader-traces
          path: app/test-results
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run native:sync --workspace app
      - run: ./gradlew lintDebug assembleDebug bundleRelease
        working-directory: app/android
      - uses: actions/upload-artifact@v7
        with:
          name: cyberjudah-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: cyberjudah-android-unsigned-bundle
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run native:sync --workspace app
      - name: Compile for the iOS simulator without signing
        run: xcodebuild -project app/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/cyberjudah-ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        with:
          name: cyberjudah-ios-simulator
          path: /tmp/cyberjudah-ios/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 7
      - name: Archive the device build without signing or submission
        run: xcodebuild -project app/ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release -archivePath /tmp/cyberjudah-device.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v7
        with:
          name: cyberjudah-ios-unsigned-archive
          path: /tmp/cyberjudah-device.xcarchive
          retention-days: 7
