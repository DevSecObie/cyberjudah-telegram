name: web

# The CyberJudah web app at web.cyberjudah.io: the iPhone app's own web export, built from one
# pinned commit of DevSecObie/cyberjudah-app with the store app's production settings (it reads
# cyberjudah.io, like the App Store build). Runs only by hand, and the production environment's
# reviewer approves it before anything goes live. The new build goes up as a version that serves
# nobody, is checked on its own version URL, then replaces the live one in one switch. Roll back
# with `wrangler rollback` on the cyberjudah-web Worker (seconds); the Telegram Worker and the
# cyberjudah.io site are not touched.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-production
  cancel-in-progress: false

env:
  # The app commit the iPhone build was checked against. Change it in a pull request.
  APP_COMMIT: 11d6f8d83994bb4d3d1b0bc801efbcc3a20ae341

jobs:
  deploy:
    environment:
      name: production
      url: https://web.cyberjudah.io/home
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: DevSecObie/cyberjudah-app
          ref: ${{ env.APP_COMMIT }}
          path: cyberjudah-app
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Install the app
        working-directory: cyberjudah-app
        run: |
          corepack enable
          yarn workspaces focus @bible-strong/expo
      - name: Use only the CyberJudah production settings
        working-directory: cyberjudah-app
        run: |
          cp apps/expo/.env.cyberjudah.production.example apps/expo/.env.local
          # Bible Strong's own environment files must not be loadable by the bundler.
          rm -f apps/expo/.env.production apps/expo/.env.staging apps/expo/.env.development
          # Only the app's public settings, for every later step's bundler process too.
          grep -E '^(EXPO_PUBLIC_[A-Z0-9_]+|APP_NAME)=' apps/expo/.env.cyberjudah.production.example | sed -E 's/^([A-Z0-9_]+)="?([^"]*)"?$/\1=\2/' >> "$GITHUB_ENV"
          echo NODE_ENV=production >> "$GITHUB_ENV"
          # The web app reads its resource API from its own address: web/src/worker.js serves Bible
          # chapters from files in this build and passes every other /bs request to cyberjudah.io's.
          sed -i -E 's#^EXPO_PUBLIC_RESOURCE_API_URL=.*#EXPO_PUBLIC_RESOURCE_API_URL="https://web.cyberjudah.io/bs"#' apps/expo/.env.local
          echo EXPO_PUBLIC_RESOURCE_API_URL=https://web.cyberjudah.io/bs >> "$GITHUB_ENV"
      - run: yarn workspace @bible-strong/expo typecheck
        working-directory: cyberjudah-app
      - name: Export the web app
        working-directory: cyberjudah-app
        run: yarn workspace @bible-strong/expo web:export
      - name: Check the export
        working-directory: cyberjudah-app
        run: |
          set -euo pipefail
          node apps/expo/scripts/check-web-assets.mjs
          # The production servers must be in the bundle, and the profile must be CyberJudah's.
          grep -rqF 'https://web.cyberjudah.io/bs' apps/expo/dist/_expo/static/js/web || { echo "::error::The export does not read web.cyberjudah.io/bs: the production settings were not applied."; exit 1; }
          grep -rqF 'cyberjudah-app.firebaseapp.com' apps/expo/dist/_expo/static/js/web || { echo "::error::The export does not use CyberJudah's Firebase project."; exit 1; }
      - name: Stage the files
        run: |
          set -euo pipefail
          rm -rf web/dist
          cp -R cyberjudah-app/apps/expo/dist web/dist
          # Every page: no MIME sniffing, no full URL sent to other sites, and no other site may
          # show the app inside a frame. Expo names each script by its content, so those keep a year.
          cat > web/dist/_headers <<'HEADERS'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Content-Security-Policy: frame-ancestors 'self'
          /_expo/static/*
            Cache-Control: public, max-age=31536000, immutable
          HEADERS
          sed -i 's/^          //' web/dist/_headers
          cat web/dist/_headers
          echo "staged $(find web/dist -type f | wc -l) files"
      - name: Add the Bible chapters
        # Read from the live cyberjudah.io/bs API into this version's files (web/src/worker.js).
        run: node .github/scripts/build-web-bible.mjs web/dist
      - name: Install wrangler
        # The app build set NODE_ENV=production for later steps; wrangler and the postinstall
        # patch step are devDependencies here, so this install is a development one.
        env:
          NODE_ENV: development
        run: npm ci --no-audit --no-fund --include=dev
      # Blue-green: the new build is uploaded as a version that serves no visitors, checked on
      # its own version URL, and only then switched in for everyone in one step. The version it
      # replaces stays on Cloudflare for `wrangler rollback`.
      - name: Apply the Worker's address settings
        # Turns on version URLs (preview_urls) so an uploaded version can be checked by itself.
        # This changes no code that visitors get.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler triggers deploy --config web/wrangler.jsonc
      - name: Upload the new version (not live yet)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.jsonl
        run: |
          set -euo pipefail
          npx wrangler versions upload --config web/wrangler.jsonc --message "app ${APP_COMMIT::12}"
          node -e '
            const rows = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").map(l => JSON.parse(l));
            const row = rows.reverse().find(r => r.type === "version-upload");
            if (!row?.version_id) throw new Error("wrangler did not report the uploaded version");
            if (!row.preview_url) throw new Error("the uploaded version has no version URL to check (preview_urls)");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `version=${row.version_id}\nurl=${row.preview_url}\n`);
            console.log(`uploaded ${row.version_id} at ${row.preview_url}`);
          ' "$WRANGLER_OUTPUT_FILE_PATH"
      - name: Check the new version before it goes live
        env:
          VERSION_URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          node .github/scripts/check-web-version.mjs "$VERSION_URL" web/dist
      - name: Switch web.cyberjudah.io to the new version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.upload.outputs.version }}
        run: |
          npx wrangler versions deploy "$VERSION_ID@100%" --config web/wrangler.jsonc --yes \
            || { echo "::error::The switch failed; web.cyberjudah.io still serves the previous version."; exit 1; }
      - name: Check web.cyberjudah.io
        run: |
          set -euo pipefail
          node .github/scripts/check-web-version.mjs https://web.cyberjudah.io web/dist \
            || { echo "::error::web.cyberjudah.io does not serve the new build. Roll back with: npx wrangler rollback --name cyberjudah-web"; exit 1; }
