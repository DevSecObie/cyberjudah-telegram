name: Resource bundles
on:
  pull_request:
    paths:
      - resources/**
      - shared/resources.ts
      - bot/src/refs.mjs
      - bot/src/resources.ts
      - bot/tests/resource-artifact.ts
      - .github/workflows/resource-bundles.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified approved bundles after production approval
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test resources/*.test.mjs
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/resource-sources
          key: resource-sources-${{ hashFiles('resources/sources.lock.json') }}
      - name: Convert pinned sources
        run: node resources/build-bundles.mjs --out "$RUNNER_TEMP/resource-bundles" --cache "$RUNNER_TEMP/resource-sources"
      - name: Measure checked OCR excerpts
        run: node resources/ocr-report.mjs "$RUNNER_TEMP/resource-sources" "$RUNNER_TEMP/resource-bundles/ocr-report.json"
      - name: Verify publication artifacts without writing to R2
        run: node resources/publish.mjs --bundle "$RUNNER_TEMP/resource-bundles"
      - name: Exercise Worker publication and indexed reads with generated bytes
        run: |
          npm --prefix bot/tests ci --ignore-scripts --no-audit --no-fund --workspaces=false
          node --import ./bot/tests/node_modules/tsx/dist/loader.mjs bot/tests/resource-artifact.ts "$RUNNER_TEMP/resource-bundles"
      - uses: actions/upload-artifact@v7
        with:
          name: approved-resource-bundles-${{ github.sha }}
          path: ${{ runner.temp }}/resource-bundles
          retention-days: 30
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: bundles
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v7
        with:
          name: approved-resource-bundles-${{ github.sha }}
          path: ${{ runner.temp }}/resource-bundles
      - name: Publish through the validated catalog API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: node resources/publish-ci.mjs --bundle "$RUNNER_TEMP/resource-bundles"
