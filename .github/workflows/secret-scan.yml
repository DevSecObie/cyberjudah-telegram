name: Secret scan

# Gitleaks over every new commit, so a password, key or token is caught before it merges.
#   * Pull request: the pull request's own commits, including what a merge commit adds.
#   * Push to main: the pushed commits (catches anything merged without a pull request).
#     Pushes made by workflows with GITHUB_TOKEN start no workflows, so the weekly scan covers those.
#   * Weekly and by hand: the whole history, in case new rules find something old.
# Findings print rule, file, line, commit and fingerprint only: never the value or the author.
# A real secret must be revoked and replaced first: removing it from the code doesn't make it safe.
# A false alarm goes in .gitleaks.toml (an allowlist) or .gitleaksignore (its fingerprint, which
# names the commit, so it doesn't survive a squash merge), with a comment saying why.
#
# Nothing being scanned can switch the scan off or allow its own finding:
#   * pull_request_target runs this file as it is on the base branch, not the pull request's copy;
#   * the settings (.gitleaks.toml, .gitleaksignore) always come from the default branch as it was
#     before the change being scanned: as it is now for pull requests, weekly and manual scans;
#     from before the push for a push to it; and on a push to it with no usable "before" (a new
#     or force-pushed default branch), the default rules only;
#   * Gitleaks is given only .git, from an empty folder, so it never reads the files being scanned;
#     inline "gitleaks:allow" comments are ignored;
#   * nothing from the pull request is run or written out: its commits are only read as data.
# So an allowlist change must merge into the default branch on its own first. Gitleaks runs from
# its official image, pinned by digest, with no network; this job has read-only access and keeps
# no credentials. This check belongs to the base branch's latest commit (pull_request_target), and
# a pull request opened before this file reached its base is first scanned on its next push.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request's older runs are cancelled (its newest run scans all its commits). Pushes
# and full scans each run to the end, so no pushed commit goes unscanned.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # All branches and tags, plus the pull request's commits. No files are written out (the
      # sparse pattern matches nothing): the scan reads .git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: /.no-files-checked-out
          sparse-checkout-cone-mode: false
      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          MAIN: ${{ github.event.repository.default_branch }}
          # The pushed branch (on pushes; the base branch otherwise, unused).
          REF_NAME: ${{ github.ref_name }}
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -euo pipefail
          fail() { echo "::error title=Secret scan failed::$1"; exit 1; }
          need_commit() { git cat-file -e "$1^{commit}" 2>/dev/null || fail "Commit $1 is not in the checkout."; }
          # What to scan: range (new commits only), else branch (that branch's whole history), else
          # every branch and tag.
          range='' branch=''
          case "$EVENT" in
            pull_request_target)
              # The pull request as it is now (so a re-run scans its current commits), against its
              # base branch as it is now.
              base="origin/$PR_BASE_REF"; need_commit "$base"; head="$(git rev-parse HEAD)"
              range="$base..$head"; from="origin/$MAIN"; need_commit "$from" ;;
            push)
              # The pushed commits. A new branch or a rewritten one (force push) has no usable
              # "before": that branch's whole history. A deleted branch adds nothing.
              if [[ "$PUSH_AFTER" =~ ^0+$ ]]; then echo "Branch deleted: nothing to scan."; exit 0; fi
              need_commit "$PUSH_AFTER"
              before=''
              if [[ ! "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                before="$PUSH_BEFORE"
                if git merge-base --is-ancestor "$PUSH_AFTER" "$before"; then
                  echo "The branch moved back to an older commit: nothing new to scan."; exit 0
                fi
                git merge-base --is-ancestor "$before" "$PUSH_AFTER" && range="$before..$PUSH_AFTER"
              fi
              [[ -n "$range" ]] || branch="$PUSH_AFTER"
              # On the default branch, origin/$MAIN is now the pushed commit: use its tip from
              # before the push, or no settings at all.
              if [[ "$REF_NAME" == "$MAIN" ]]; then from="$before"
              else from="origin/$MAIN"; need_commit "$from"; fi ;;
            *)
              # Weekly or by hand: every branch and tag (on a public repository a secret on any branch
              # is exposed).
              from="origin/$MAIN"; need_commit "$from" ;;
          esac
          if [[ -n "$range" ]]; then
            count=$(git rev-list --count "$range")
            if (( count == 0 )); then
              echo "No new commits in $range: nothing to scan."; exit 0
            fi
            echo "Scanning $count commits ($range), settings from ${from:-nowhere (default rules only)}"
          else
            echo "Scanning the whole history of ${branch:-every branch and tag}, settings from ${from:-nowhere (default rules only)}"
          fi
          settings="$RUNNER_TEMP/gitleaks"
          mkdir -p "$settings"
          # One line per finding, without the author's name and email that --verbose would print.
          printf '%s\n' '{{ range . }}Finding: {{ .RuleID }} in {{ .File }} line {{ .StartLine }}, commit {{ .Commit }}' \
            'Fingerprint: {{ .Fingerprint }}' '{{ end }}' > "$settings/report.tmpl"
          # Exit code 3 means leaks; anything else non-zero is an error in the scan itself.
          # --remerge-diff also shows what a merge commit adds while resolving a conflict, which a
          # plain git log leaves out.
          args=(git /repo --redact=100 --no-banner --exit-code 3 --ignore-gitleaks-allow
            --report-format template --report-template /settings/report.tmpl --report-path -)
          args+=("--log-opts=--full-history --remerge-diff ${range:-${branch:---all}}")
          setting() {
            if [[ -n "$from" ]] && git show "$from:$1" > "$settings/$2" 2>/dev/null; then echo "$1 from $from"
            else rm -f "$settings/$2"; echo "No $1${from:+ at $from}: default rules for it"; return 1; fi
          }
          setting .gitleaks.toml gitleaks.toml && args+=(--config /settings/gitleaks.toml)
          setting .gitleaksignore gitleaksignore && args+=(--gitleaks-ignore-path /settings/gitleaksignore)
          # Gitleaks also reads .gitleaks.toml and .gitleaksignore from the folder it scans and the
          # one it runs in. It scans only .git, which has no working files, and runs in an empty
          # /tmp, so only the settings above apply.
          # As the runner's own user: git refuses a repository owned by someone else, and nothing
          # here needs root. .git is writable because --remerge-diff stores temporary objects in it.
          # File names come from the commits: workflow commands are off while Gitleaks prints them.
          stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          status=0
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp -w /tmp \
            -v "$PWD/.git:/repo" -v "$settings:/settings:ro" "$GITLEAKS_IMAGE" "${args[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/gitleaks.log" || status=$?
          echo "::$stop::"
          # Gitleaks logs a git error and still reports "no leaks found", so any logged error fails
          # the job, with or without findings (part of the range may not have been scanned).
          errors=$(sed -E $'s/\x1b\\[[0-9;]*m//g' "$RUNNER_TEMP/gitleaks.log" \
            | grep -vE '^(Finding|Fingerprint): ' | grep -cE '(^| )(ERR|FTL)( |$)' || true)
          if (( status == 3 )); then
            echo "::error title=Secret found::Gitleaks found what looks like a secret (listed above, value not shown). If it is real: revoke it and make a new one first, then remove it. If it is a false alarm: allow it in .gitleaks.toml by its exact value or path (this survives squash merges; a .gitleaksignore fingerprint names the commit and does not), with a comment saying why, in a separate pull request; then run this check again."
          fi
          if (( errors > 0 )) || (( status != 0 && status != 3 )); then
            echo "::error title=Secret scan failed::Gitleaks could not scan everything (exit $status, $errors errors logged): see the log above. Check .gitleaks.toml and the scanned range."
            (( status == 3 )) || status=1
          fi
          exit "$status"
