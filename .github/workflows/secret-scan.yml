name: Secret scan

# Gitleaks over every new commit, so a password, key or token is caught before it merges.
#   * Pull request: the pull request's own commits, including what a merge commit adds.
#   * Push to main: the pushed commits (catches anything merged without a pull request).
#     Pushes made by workflows with GITHUB_TOKEN start no workflows, so the weekly scan covers
#     those.
#   * Weekly and by hand: the whole history of every branch and tag, in case new rules find
#     something old.
# Findings print rule, file, line, commit and fingerprint only: never the value or the author.
# A real secret must be revoked and replaced first: removing it from the code doesn't make it safe.
# A false alarm goes in .gitleaks.toml (an allowlist) or .gitleaksignore (its fingerprint, which
# names the commit, so it doesn't survive a squash merge), with a comment saying why.
#
# A pull request runs its own copy of this file (pull_request: GitHub blocks pull_request_target
# in public repositories by default from 2026-12-02, and it can't be a required check). So a pull
# request that edits this file can change its own scan. Such an edit shows in the diff, and
# reviewing it is the only control (a CODEOWNERS entry for .github/workflows/ can enforce that):
# after it merges, the push and weekly scans run the merged copy too. Short of that, nothing in a
# pull request, and no single push, can switch the scan off or allow its own finding (a direct
# push to an unprotected default branch can still add an allowlist entry ahead of a secret;
# protect the branch to rule that out):
#   * the settings (.gitleaks.toml, .gitleaksignore) always come from the default branch as it was
#     before the change being scanned: as it is now for pull requests, weekly and manual scans;
#     from before the push for a push to it (fetched by its id if a force push left it out);
#     and the default rules only if there is no such commit (a new default branch);
#   * Gitleaks is given only .git, from an empty folder, so it never reads the files being scanned;
#     inline "gitleaks:allow" comments are ignored;
#   * nothing from the pull request is run or written out: the job fetches into an empty .git of
#     its own, and the commits are only read as data.
# So an allowlist change must merge into the default branch on its own first. Gitleaks runs from
# its official image, pinned by digest, with no network. This job has read-only access; its token
# is used only to fetch this repository before the scan, and is never stored or given to the
# scanner. The check belongs to the pull request's head commit, so it can be a required check.
# GitHub runs this file as it is in the pull request merged into its base, so a pull request is
# scanned as soon as its base branch has it.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request's older runs are cancelled (its newest run scans all its commits). Pushes
# and full scans each run to the end, so no pushed commit goes unscanned.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scan for secrets
        env:
          # The commit to scan: the pull request as it is now, or the pushed or selected commit.
          TARGET: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          EVENT: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          MAIN: ${{ github.event.repository.default_branch }}
          # The pushed branch (on pushes; the base branch otherwise, unused).
          REF_NAME: ${{ github.ref_name }}
          # Read-only; used only to fetch this repository before the scan, never stored or passed on.
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -euo pipefail
          fail() { echo "::error title=Secret scan failed::$1"; exit 1; }
          need_commit() { git cat-file -e "$1^{commit}" 2>/dev/null || fail "Commit $1 is not in the repository."; }
          # Runs one git command that fetches from this repository. The token goes to the GitHub server
          # only, through that command's environment (not its arguments), with background maintenance off
          # so nothing touches .git afterwards.
          with_token() {
            GIT_CONFIG_COUNT=3 \
              GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL:-https://github.com}/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN:-}" | base64 | tr -d '\n')" \
              GIT_CONFIG_KEY_1=gc.auto GIT_CONFIG_VALUE_1=0 GIT_CONFIG_KEY_2=maintenance.auto GIT_CONFIG_VALUE_2=false \
              "$@"
          }
          # The commit to scan and the branches the scan needs (every branch and tag for a full scan),
          # with all their contents, into an empty .git of the job's own: not a partial clone, as
          # Gitleaks has no network to fetch anything later. No files are written out; the scan reads
          # .git only.
          branch_ref() { echo "+refs/heads/$1:refs/remotes/origin/$1"; }
          case "$EVENT" in
            pull_request)
              refs=("$(branch_ref "$MAIN")")
              [[ "$PR_BASE_REF" == "$MAIN" ]] || refs+=("$(branch_ref "$PR_BASE_REF")") ;;
            push) refs=("$(branch_ref "$MAIN")") ;;
            *) refs=('+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*') ;;
          esac
          cd "$(mktemp -d "$RUNNER_TEMP/scan.XXXXXX")"
          git init -q
          git remote add origin "${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY"
          for attempt in 1 2 3; do
            with_token git fetch -q --no-tags origin "${refs[@]}" "+$TARGET:refs/scan/target" && break
            (( attempt < 3 )) || fail "Could not fetch the repository (${refs[*]} and $TARGET)."
            sleep $(( attempt * 10 ))
          done
          # HEAD stays unborn: nothing git reads from HEAD by default comes from the commits scanned.
          target="$(git rev-parse refs/scan/target)"
          # A commit no branch points at any more (overwritten by a force push), fetched by its id.
          fetch_commit() {
            git cat-file -e "$1^{commit}" 2>/dev/null && return 0
            local out attempt
            for attempt in 1 2 3; do
              out=$(with_token git fetch -q --no-tags origin "$1" 2>&1) && break
              (( attempt < 3 )) && sleep $(( attempt * 10 ))
            done
            if ! git cat-file -e "$1^{commit}" 2>/dev/null; then
              out="${out:-not found}"; out="${out//'%'/%25}"; out="${out//$'\r'/}"; out="${out//$'\n'/%0A}"
              echo "::warning title=Secret scan::Could not fetch the commit before the push ($1): $out"
              return 1
            fi
          }
          # What to scan: range (new commits only), else branch (that branch's whole history), else
          # every branch and tag.
          range='' branch=''
          case "$EVENT" in
            pull_request)
              # The pull request as it is now (so a re-run scans its current commits), against its
              # base branch as it is now.
              base="origin/$PR_BASE_REF"; need_commit "$base"; head="$target"
              range="$base..$head"; from="origin/$MAIN"; need_commit "$from" ;;
            push)
              # The pushed commits: those not already on the branch's tip from before the push. That
              # tip is fetched by its id if a force push left it out. With no such tip (a new
              # branch), the branch's whole history. A deleted branch adds nothing.
              if [[ "$PUSH_AFTER" =~ ^0+$ ]]; then echo "Branch deleted: nothing to scan."; exit 0; fi
              need_commit "$PUSH_AFTER"
              before=''
              if [[ ! "$PUSH_BEFORE" =~ ^0+$ ]] && fetch_commit "$PUSH_BEFORE"; then
                before="$PUSH_BEFORE"
                if git merge-base --is-ancestor "$PUSH_AFTER" "$before"; then
                  echo "The branch moved back to an older commit: nothing new to scan."; exit 0
                fi
                range="$before..$PUSH_AFTER"
              else
                branch="$PUSH_AFTER"
              fi
              # On the default branch origin/$MAIN is now the pushed commit, so the settings come from
              # its tip before the push, or, without one, the default rules only.
              if [[ "$REF_NAME" == "$MAIN" ]]; then
                from="$before"
                [[ -n "$from" ]] || echo "::warning title=Secret scan::No commit from before this push to the default branch: scanning with the default rules only."
              else from="origin/$MAIN"; need_commit "$from"; fi ;;
            *)
              # Weekly or by hand: every branch and tag (on a public repository a secret on any branch
              # is exposed).
              from="origin/$MAIN"; need_commit "$from" ;;
          esac
          unset GH_TOKEN
          if [[ -n "$range" ]]; then
            count=$(git rev-list --count "$range")
            if (( count == 0 )); then
              echo "No new commits in $range: nothing to scan."; exit 0
            fi
            echo "Scanning $count commits ($range), settings from ${from:-nowhere (default rules only)}"
          else
            echo "Scanning the whole history of ${branch:-every branch and tag}, settings from ${from:-nowhere (default rules only)}"
          fi
          settings="$RUNNER_TEMP/gitleaks"
          mkdir -p "$settings"
          # One line per finding, without the author's name and email that --verbose would print.
          printf '%s\n' '{{ range . }}Finding: {{ .RuleID }} in {{ .File }} line {{ .StartLine }}, commit {{ .Commit }}' \
            'Fingerprint: {{ .Fingerprint }}' '{{ end }}' > "$settings/report.tmpl"
          # Exit code 3 means leaks; anything else non-zero is an error in the scan itself.
          # --remerge-diff also shows what a merge commit adds while resolving a conflict, which a
          # plain git log leaves out.
          args=(git /repo --redact=100 --no-banner --exit-code 3 --ignore-gitleaks-allow
            --report-format template --report-template /settings/report.tmpl --report-path -)
          args+=("--log-opts=--full-history --remerge-diff ${range:-${branch:---all}}")
          setting() {
            if [[ -n "$from" ]] && git show "$from:$1" > "$settings/$2" 2>/dev/null; then echo "$1 from $from"
            else rm -f "$settings/$2"; echo "No $1${from:+ at $from}: default rules for it"; return 1; fi
          }
          setting .gitleaks.toml gitleaks.toml && args+=(--config /settings/gitleaks.toml)
          setting .gitleaksignore gitleaksignore && args+=(--gitleaks-ignore-path /settings/gitleaksignore)
          # Gitleaks also reads .gitleaks.toml and .gitleaksignore from the folder it scans and the
          # one it runs in. It scans only .git, which has no working files, and runs in an empty
          # /tmp, so only the settings above apply. Git reads no .gitattributes from the commits
          # either (there is no working tree, and HEAD is unborn), so none can mark files binary and
          # hide their contents; as a safeguard, their source is also set to an empty tree.
          # As the runner's own user: git refuses a repository owned by someone else, and nothing
          # here needs root. .git is writable because --remerge-diff stores temporary objects in it.
          # File names come from the commits: workflow commands are off while Gitleaks prints them.
          empty_tree="$(git hash-object -t tree -w /dev/null)"
          stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          status=0
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp -w /tmp \
            -e GIT_ATTR_SOURCE="$empty_tree" \
            -v "$PWD/.git:/repo" -v "$settings:/settings:ro" "$GITLEAKS_IMAGE" "${args[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/gitleaks.log" || status=$?
          echo "::$stop::"
          # Gitleaks logs a git error and still reports "no leaks found", so any logged error fails
          # the job, with or without findings (part of the range may not have been scanned).
          errors=$(sed -E $'s/\x1b\\[[0-9;]*m//g' "$RUNNER_TEMP/gitleaks.log" \
            | grep -vE '^(Finding|Fingerprint): ' | grep -cE '(^| )(ERR|FTL)( |$)' || true)
          if (( status == 3 )); then
            echo "::error title=Secret found::Gitleaks found what looks like a secret (listed above, value not shown). If it is real: revoke it and make a new one first, then remove it. If it is a false alarm: allow it in .gitleaks.toml by its exact value or path (this survives squash merges; a .gitleaksignore fingerprint names the commit and does not), with a comment saying why, in a separate pull request; then run this check again."
          fi
          if (( errors > 0 )) || (( status != 0 && status != 3 )); then
            echo "::error title=Secret scan failed::Gitleaks could not scan everything (exit $status, $errors errors logged): see the log above. Check .gitleaks.toml and the scanned range."
            (( status == 3 )) || status=1
          fi
          exit "$status"
