name: CMS content
on:
  pull_request:
  # The merge queue tests each queued PR on top of main before it lands (Settings → Branches).
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cms-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Transcript corpus for changed Timeline records
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: DevSecObie/cyberjudah
          ref: main
          path: .cms-corpus
          sparse-checkout: |
            blog/transcripts
            history/transcripts
            data/bible
      - name: Validate source content and corpus evidence
        env:
          CMS_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CJ_ROOT: .cms-corpus
        run: node scripts/check-cms.mjs
      - name: Rebuild reader content from reviewed source
        run: node app/scripts/final-captivity/build.mjs && node app/scripts/between-testaments/build.mjs
