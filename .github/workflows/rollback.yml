name: rollback

# Restores a previous Worker deployment without rebuilding: `wrangler rollback` repoints the
# worker at an already-deployed version, so the code that ran before is the code that runs
# again — no fresh dependency resolution. Runs against production by default.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which worker to roll back"
        type: choice
        options: [production, staging]
        default: production
      version:
        description: "Version id to restore (from 'wrangler deployments list'); empty means the deployment before the current one"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          FLAG=""
          [ "$TARGET_ENV" = "staging" ] && FLAG="--env staging"
          echo "Recent deployments:"
          npx wrangler deployments list $FLAG 2>/dev/null || true
          if [ -n "$TARGET_VERSION" ]; then
            echo "Rolling back to version $TARGET_VERSION"
            npx wrangler rollback "$TARGET_VERSION" $FLAG
          else
            echo "Rolling back to the previous deployment"
            npx wrangler rollback $FLAG
          fi
          echo "Rolled back. Verify with the health endpoint and the release checklist in docs/OPERATIONS.md."
