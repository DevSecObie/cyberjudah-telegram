name: rollback

# Restores a previous Worker deployment without rebuilding: `wrangler rollback` repoints the
# worker at an already-deployed version, so the code that ran before is the code that runs
# again — no fresh dependency resolution. Runs against production by default.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which worker to roll back"
        type: choice
        options: [production, staging]
        default: production
      version:
        description: "Version id to restore: the deploy run's 'Serving before this deploy' line. Empty lists recent versions and stops."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The repository's own wrangler, not whatever npx would fetch that day.
      - run: npm ci --no-audit --no-fund
      - working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          FLAG=""
          [ "$TARGET_ENV" = "staging" ] && FLAG="--env staging"
          echo "Recent deployments:"
          npx wrangler deployments list $FLAG 2>/dev/null || true
          if [ -n "$TARGET_VERSION" ] && ! [[ "$TARGET_VERSION" =~ ^[0-9a-f-]{8,64}$ ]]; then
            echo "::error::That does not look like a Worker version id."; exit 1
          fi
          if [ -n "$TARGET_VERSION" ]; then
            echo "Rolling back to version $TARGET_VERSION"
            npx wrangler rollback "$TARGET_VERSION" $FLAG
          else
            # A bare `wrangler rollback` steps back one version, and every `wrangler secret put`
            # in deploy.yml makes a version of the NEW code, so it would land on the release being
            # undone. Pick the id instead: the failed deploy run logs "Serving before this deploy: <id>".
            echo "::error::Give the version id to restore. Find it in the deploy run's 'Serving before this deploy' line, or in the list above (the newest version before the bad release, not one of the secret updates after it)."
            exit 1
          fi
          echo "Rolled back. Verify with the health endpoint and the release checklist in docs/OPERATIONS.md."
