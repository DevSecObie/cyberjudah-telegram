name: draft-notes

# Drafts class notes from the captions for classes that have none, and opens one pull
# request to the cyberjudah repository with them for review. On demand only.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many unwritten classes to draft (newest first)"
        type: number
        default: 2
      videos:
        description: "Or specific YouTube video ids, space-separated"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A fine-grained token with contents and pull-request write on DevSecObie/cyberjudah,
          # added under Settings → Secrets and variables → Actions. Without it the drafts are
          # kept as a workflow artifact instead.
          CYBERJUDAH_TOKEN: ${{ secrets.CYBERJUDAH_TOKEN }}
          VIDEOS: ${{ inputs.videos }}
          COUNT: ${{ inputs.count }}
        run: |
          set -- --count "$COUNT" --out drafts
          for v in $VIDEOS; do set -- "$@" --video "$v"; done
          node scripts/draft-note.mjs "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: class-note-drafts
          path: bot/drafts
          if-no-files-found: ignore
