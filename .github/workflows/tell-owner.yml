name: tell-owner

# A Claude thread sends the owner one Telegram message through the CyberJudah bot: a question, or
# something that needs him. Run by hand or by a thread through workflow_dispatch on main (only
# people and apps with write access to this repository can). The bot token and the owner's chat
# id come from the "automation" environment's secrets, never from the inputs, and the message is
# sent as plain text. It is not printed in the log, but treat it as visible to anyone who can see
# this repository's runs: never put a secret, a key or someone's personal data in it.

on:
  workflow_dispatch:
    inputs:
      message:
        description: "What to tell or ask the owner (plain text, up to 3500 characters)"
        type: string
        required: true
      from:
        description: "Who is asking: the thread's title"
        type: string
        required: true
      link:
        description: "Optional: one https:// link (a pull request, an artifact)"
        type: string
        required: false

permissions:
  contents: read

# One message at a time, in the order they were asked.
concurrency:
  group: tell-owner
  cancel-in-progress: false

jobs:
  tell:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Secrets for unattended jobs live in the "automation" environment (main only, no reviewer).
    environment:
      name: automation
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/custodian
          persist-credentials: false
      - name: Send the message
        # The inputs reach the script only as environment variables, never inside the command.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_IDS: ${{ secrets.CUSTODIAN_ALERT_CHAT_ID || secrets.ADMIN_IDS }}
          TELL_MESSAGE: ${{ inputs.message }}
          TELL_FROM: ${{ inputs.from }}
          TELL_LINK: ${{ inputs.link }}
        run: python3 .github/custodian/custodian.py tell
