name: stage

# Ready pull requests against main get deployed to the staging worker; drafts run checks only.
# This exercises the bot, the app
# and the hourly jobs are exercised against staging resources before anything reaches
# production. Production (deploy.yml) still only runs on pushes to main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the currently deployed staging app without deploying again
        type: boolean
        default: false
      diagnose_login:
        description: Observe one staging login callback using bounded outcome codes only
        type: boolean
        default: false

permissions:
  contents: read

# One staging Worker and one staging database serve every pull request, so runs take turns:
# two at once collide in the search-index import ("Cannot start another import") and race to
# decide which build staging shows. A queued run waits; none is cancelled.
concurrency:
  group: ${{ (inputs.verify_only || inputs.diagnose_login) && 'staging-verification' || (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'staging-draft-checks' || 'staging' }}
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !inputs.verify_only && !inputs.diagnose_login }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_URL: ${{ vars.TELEGRAM_APP_URL }}
          VITE_ACCOUNT_SYNC: "true"
          VITE_ACCOUNT_SYNC_SCOPE: staging
          CYBERJUDAH_APP_BASE: /app/

  stage:
    # CMS review branches require an owner workflow_dispatch to stage, even when ready.
    # Dependabot's pull request runs get no repository secrets, so they cannot deploy to staging.
    if: ${{ !inputs.verify_only && !inputs.diagnose_login && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && !startsWith(github.head_ref, 'cms/') && !startsWith(github.head_ref, 'codex/cms-'))) }}
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check the staging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_BOT_TOKEN: ${{ secrets.STAGING_BOT_TOKEN }}
          STAGING_WEBHOOK_SECRET: ${{ secrets.STAGING_WEBHOOK_SECRET }}
        run: |
          missing=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_BOT_TOKEN STAGING_WEBHOOK_SECRET; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/PRODUCTION_CHECKLIST.md for the staging setup (a second @BotFather bot)."
            exit 1
          fi
          echo "All four staging secrets are set."
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_APP_URL: ${{ vars.TELEGRAM_APP_URL }}
          VITE_ACCOUNT_SYNC: "true"
          VITE_ACCOUNT_SYNC_SCOPE: staging
          CYBERJUDAH_APP_BASE: /app/
      - name: Check out the Bible Strong app port
        uses: actions/checkout@v4
        with:
          repository: DevSecObie/cyberjudah-app
          ref: 4a04c2e2d75ab29009718a8e62c1edc98ba6f35e
          path: bible-strong-port
          persist-credentials: false
      - name: Export the actual Bible Strong app
        working-directory: bible-strong-port
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          corepack enable
          yarn workspaces focus @bible-strong/expo
          cp apps/expo/.env.cyberjudah.example apps/expo/.env.local
          yarn workspace @bible-strong/expo typecheck
          yarn workspace @bible-strong/expo exec expo export --platform web
          rm -rf ../app/dist
          cp -R apps/expo/dist ../app/dist
      - name: Check out the native release files
        uses: actions/checkout@v4
        with:
          repository: DevSecObie/cyberjudah-app
          ref: cbecb87cc71fa82029d919889e4b3b554ddf20d3
          path: native-release
          persist-credentials: false
          sparse-checkout: apps/expo/public
      - name: Serve the native release's own files
        # iPhone build 304 downloads its People module and plays videos from CyberJudah's own
        # player page. Add those files beside the web export without replacing any of its own.
        run: |
          set -euo pipefail
          src=native-release/apps/expo/public
          cp -n "$src/offline/bible_entities.cyberjudah.sqlite.zip" app/dist/offline/
          mkdir -p app/dist/embed
          cp -n "$src/embed/youtube.html" app/dist/embed/
          sha256sum app/dist/offline/bible_entities.cyberjudah.sqlite.zip app/dist/embed/youtube.html
      - name: Check out CyberJudah's own dictionaries
        uses: actions/checkout@v4
        with:
          repository: DevSecObie/cyberjudah-app
          ref: 4fab408d38b4b9447e8e3afe223b66e9471f8208
          path: dictionary-release
          persist-credentials: false
          sparse-checkout: apps/expo/public/offline
      - name: Serve CyberJudah's own dictionaries
        # The Jewish Encyclopedia download, and the catalog that lists it beside the files above.
        run: |
          set -euo pipefail
          src=dictionary-release/apps/expo/public/offline
          mkdir -p app/dist/offline/dictionaries
          cp -n "$src/dictionaries/dictionary-jewish-encyclopedia-en.sqlite.zip" app/dist/offline/dictionaries/
          cp "$src/catalog.json" app/dist/offline/catalog.json
          sha256sum app/dist/offline/dictionaries/*.zip app/dist/offline/catalog.json
      - name: Deploy the staging worker
        id: deploy
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Staging gets its own D1 database and KV namespace; the ids are written into the
          # staging env the same way deploy.yml does for production.
          D1=$(bash scripts/d1-id.sh cyberjudah-telegram-staging)
          TEACH=$(bash scripts/d1-id.sh cyberjudah)
          KV=$(bash scripts/kv-id.sh SUBS-STAGING)
          python3 - "$D1" "$TEACH" "$KV" <<'EOF'
          import json, sys
          d1, teach, kv = sys.argv[1], sys.argv[2], sys.argv[3]
          p = "wrangler.jsonc"
          s = open(p).read()
          # Replace only inside the staging env block: it is the last "env" section of the file.
          head, env = s.split('"env": {', 1)
          env = env.replace("00000000-0000-0000-0000-000000000000", d1)
          env = env.replace("11111111-1111-1111-1111-111111111111", teach)
          env = env.replace("00000000000000000000000000000000", kv)
          open(p, "w").write(head + '"env": {' + env)
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wrangler.jsonc')
          s=p.read_text().replace('"/app/strong", "/app/strong/*"', '"/app", "/app/*"', 1)
          head, env=s.split('"env": {',1)
          env=env.replace('"vars": {','"vars": {"BIBLE_STRONG_WEB": "1", ',1)
          p.write_text(head+'"env": {'+env)
          PY
          set -o pipefail
          # Stage the built app for Workers Static Assets (see the script header).
          bash scripts/prepare-assets.sh
          npx wrangler deploy --env staging 2>&1 | tee deploy.log
          URL=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Staging worker: $URL"
      - name: Publish the online Jewish Encyclopedia to staging
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 scripts/build-study-reference.py \
            ../dictionary-release/apps/expo/public/offline/dictionaries/dictionary-jewish-encyclopedia-en.sqlite.zip \
            ../dictionary-release/apps/expo/public/offline/catalog.json \
            "$RUNNER_TEMP/study-reference.sql"
          npx wrangler d1 execute cyberjudah-telegram-staging --remote --yes --file "$RUNNER_TEMP/study-reference.sql"
          curl -fsS "${{ steps.deploy.outputs.url }}/bs/v1/dictionaries/jewish-encyclopedia/en/entries?search=abraham&limit=3" > "$RUNNER_TEMP/study-reference-smoke.json"
          node -e 'const p=require(process.argv[1]); if(!p.entries?.length || p.resource?.work!=="jewish-encyclopedia") throw Error("Online reference smoke test failed"); console.log("Online encyclopedia entries verified:",p.entries.length)' "$RUNNER_TEMP/study-reference-smoke.json"
      - name: Load the search index into the staging database
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEARCH_DB: cyberjudah-telegram-staging
        run: node scripts/load-search.mjs
      - name: Register the staging webhook, commands and menu button
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.STAGING_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.STAGING_WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN --env staging
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET --env staging
          printf '%s' "$WORKER_URL" | npx wrangler secret put WORKER_URL --env staging
          node scripts/setup.mjs
      - name: Configure staging browser sign-in
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_LOGIN_CLIENT_ID: ${{ secrets.TELEGRAM_LOGIN_CLIENT_ID }}
          TELEGRAM_LOGIN_CLIENT_SECRET: ${{ secrets.TELEGRAM_LOGIN_CLIENT_SECRET }}
          PRIVACY_KEY: ${{ secrets.PRIVACY_KEY }}
        run: |
          set -euo pipefail
          # Listing returns names only. Never rotate an existing staging encryption key.
          npx wrangler secret list --env staging > "$RUNNER_TEMP/staging-secret-names.json"
          for key in TELEGRAM_LOGIN_CLIENT_ID TELEGRAM_LOGIN_CLIENT_SECRET PRIVACY_KEY; do
            configured=$(node -e 'const names = require(process.argv[1]); console.log(names.some(s => s.name === process.argv[2]) ? "yes" : "no")' "$RUNNER_TEMP/staging-secret-names.json" "$key")
            if [ "$configured" = yes ]; then
              echo "$key is already configured; keeping its value."
            elif [ -n "${!key}" ]; then
              printf '%s' "${!key}" | npx wrangler secret put "$key" --env staging
            else
              echo "::error::Missing repository secret: $key"; exit 1
            fi
          done
      - name: Smoke-test staging
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          curl -sf "$URL/api/health" | head -c 400; echo
          # The app shell serves at the root (SPA fallback).
          curl -sf -o /dev/null -w "app: %{http_code}\n" "$URL/"
          curl -sfL "$URL/app/" | grep -q "_expo/static/js/web/"
      - name: Verify authenticated search and provider consent
        working-directory: bot
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          BOT_TOKEN: ${{ secrets.STAGING_BOT_TOKEN }}
          EXPECTED_SEARCH_MODEL: "@cf/meta/llama-3.1-8b-instruct-fp8"
          VERIFY_ACCOUNT_SYNC: "true"
          BIBLE_STRONG_WEB: "1"
          # Staging's small free answer budget is shared by every run; a spent day is reported, not failed.
          ALLOW_FREE_PAUSED: "1"
        run: node scripts/verify-release.mjs

  verify-current:
    if: github.event_name == 'workflow_dispatch' && (inputs.verify_only || inputs.diagnose_login)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve the staging worker address
        id: address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          req = urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain', headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          subdomain = result.get('result', {}).get('subdomain', '')
          if not result.get('success') or not re.fullmatch(r'[a-z0-9-]+', subdomain):
              raise SystemExit('Could not resolve the staging Worker address.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'url=https://cyberjudah-telegram-staging.{subdomain}.workers.dev\n')
          PY
      - name: Verify current staging
        working-directory: bot
        env:
          WORKER_URL: ${{ steps.address.outputs.url }}
          BOT_TOKEN: ${{ secrets.STAGING_BOT_TOKEN }}
          EXPECTED_SEARCH_MODEL: "@cf/meta/llama-3.1-8b-instruct-fp8"
          VERIFY_ACCOUNT_SYNC: "true"
          BIBLE_STRONG_WEB: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIAGNOSE_LOGIN: ${{ inputs.diagnose_login }}
        run: node scripts/diagnose-staging.mjs
