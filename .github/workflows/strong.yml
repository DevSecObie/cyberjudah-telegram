name: staged-fork

on:
  pull_request:
    paths:
      - 'strong/**'
      - 'bot/src/strong-content.ts'
      - 'bot/src/firebase-auth.ts'
      - 'bot/src/initdata.mjs'
      - 'bot/src/bs/**'
      - 'app/src/data/timeline.json'
      - 'app/src/data/final-captivity.json'
      - 'shared/strong-teachings.ts'
      - '.github/workflows/strong.yml'
  push:
    branches: [main]
    paths:
      - 'strong/**'
      - '.github/workflows/strong.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strong/firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix strong/firebase --workspaces=false --no-audit --no-fund
      - run: npm test --prefix strong/firebase --workspaces=false
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: strong-yarn-${{ hashFiles('strong/yarn.lock') }}
      - run: bash strong/build-web.sh
      - working-directory: strong
        run: |
          corepack yarn typecheck
          corepack yarn workspace @bible-strong/expo test --runInBand --watchman=false strongIdentities-test strongBibleConcordanceIdentity-test passageMedia-test WorkspaceLayout-test pickerSelection-test useOpenInNewTab-test publicBibleNavigation-test publicBibleRoutes-test webFirebaseConfig-test FireAuth.web-test useInitFireAuth-test useLiveUpdates-test useTabGroupsSync-test events.web-test strongBibleHttpAccess-test queryClient.web-test firebaseEmulators.web-test telegramFirebaseBridge-test telegramSources.web-test NoteScreen-test annotationDomText-test firestoreMigration-test
          node scripts/build-cyberjudah-plans.mjs --check
      - run: npx playwright install --with-deps chromium
      - run: node --test strong/tests/*.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix strong/firebase --workspaces=false --no-audit --no-fund
      - run: sh strong/firebase/build-test-web.sh
      - run: npm run test:web --prefix strong/firebase --workspaces=false
        env:
          STRONG_WEB_DIST: ${{ github.workspace }}/strong/dist-auth
