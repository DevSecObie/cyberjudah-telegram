name: verify-release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_URL: ${{ vars.WORKER_URL }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      EXPECTED_SEARCH_MODEL: "@cf/meta/llama-3.1-8b-instruct-fp8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node bot/scripts/verify-release.mjs
      - run: node bot/scripts/verify-assets.mjs
