<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberJudah icon review</title>
<style>
  :root{font:16px/1.5 system-ui,sans-serif;color:#18212b;background:#f7f7f5}
  html[data-theme=dark]{color:#edf3fa;background:#0c1420}
  html[data-theme=sepia]{color:#483623;background:#f5f2e3}
  body{max-width:1152px;margin:auto;padding:24px 16px}h1{font-size:24px;line-height:1.2;margin:0 0 8px}p{margin:0 0 18px}small{display:block;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}figure{margin:0}figcaption{margin-top:8px;font-weight:600;font-size:14px}
  .tile{position:relative;aspect-ratio:1;display:grid;place-items:center;background:#e8e6e0;overflow:hidden}.tile img{width:100%;height:100%;object-fit:contain}
  .round{border-radius:24%}.circle{border-radius:50%}.mono{background:#dbeefa}.mono img{width:100%}.safe::after{content:"";position:absolute;inset:10%;border:1px dashed #ec6380;border-radius:50%;pointer-events:none}
  .sizes{display:flex;align-items:center;gap:20px;margin:24px 0}.sizes img{object-fit:contain}.caption{font-size:13px;max-width:70ch}
  @media(max-width:600px){body{padding-top:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.sizes{margin:18px 0;gap:16px}h1{font-size:22px}}
</style>
<h1>CyberJudah icon</h1><p id="phase"></p>
<div class="grid">
  <figure><div class="tile round"><img id="light" alt="Light icon" src="../../app/public/icons/light-512.png"></div><figcaption>Light<small>Full-bleed export · preview mask</small></figcaption></figure>
  <figure><div class="tile round"><img id="dark" alt="Dark icon" src="../../app/public/icons/dark-512.png"></div><figcaption>Dark<small>Separate browser appearance</small></figcaption></figure>
  <figure><div class="tile circle safe"><img id="maskable" alt="Maskable icon" src="../../app/public/icons/maskable-512.png"></div><figcaption>Maskable<small>Dashed 80% safe-zone circle</small></figcaption></figure>
  <figure><div class="tile mono"><img id="monochrome" alt="Monochrome icon" src="../../app/public/icons/monochrome-512.png"></div><figcaption>Monochrome<small>Single ink · transparent gaps</small></figcaption></figure>
</div>
<div class="sizes"><img width="16" height="16" alt="16 pixel preview" src="../../app/public/icons/light-32.png"><img width="32" height="32" alt="32 pixel favicon" src="../../app/public/icons/light-32.png"><img width="64" height="64" alt="64 pixel icon" src="../../app/public/icons/light-64.png"><img width="80" height="80" alt="Clear foreground" src="clear.svg"></div>
<p class="caption">Artwork review, not a screenshot of an installed iOS app. Preview masks are illustrative; export files contain no rounded-square mask, outer shadow or glass effect. The PWA safe-zone circle is measured automatically.</p>
<script>
  const params=new URLSearchParams(location.search),before=params.get('phase')==='before';
  document.documentElement.dataset.theme=params.get('theme')||'light';
  document.getElementById('phase').textContent=before?'Before · existing cyber lion asset':'After · layered icon exports';
  if(before){document.querySelectorAll('img').forEach(img=>img.src='../../app/public/brand/cyber-lion.webp');document.querySelectorAll('figcaption small').forEach(label=>label.textContent='Existing asset shown in this preview');document.querySelector('.caption').textContent='The previous manifest supplied one remote icon with purpose “any”. These previews show that existing asset; separate dark, maskable and monochrome files were not supplied.';}
</script>
</html>
